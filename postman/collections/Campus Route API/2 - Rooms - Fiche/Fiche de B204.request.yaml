$kind: http-request
description: Une salle de TD standard au 2e étage.
url: "{{baseUrl}}/api/rooms/B204"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const r = pm.response.json();
      pm.test("Code B204", () => pm.expect(r.code).to.eql("B204"));
      pm.test("2e étage", () => pm.expect(r.floor).to.eql(2));
      pm.test("Type Salle de TD", () => pm.expect(r.type).to.eql("Salle de TD"));
      pm.test("Capacité 30", () => pm.expect(r.capacity).to.eql(30));
      pm.test("Équipements : tableau non vide", () => pm.expect(r.equipment).to.be.an("array").that.is.not.empty);
    language: text/javascript
order: 1000
