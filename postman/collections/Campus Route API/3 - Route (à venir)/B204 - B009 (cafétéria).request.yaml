$kind: http-request
name: B204 -> B009 (cafétéria)
description: Descente au RDC (≈ 35 m).
url: "{{baseUrl}}/api/route?from=B204&to=B009&accessible=false"
method: GET
headers:
  Accept: application/json
queryParams:
  from: B204
  to: B009
  accessible: "false"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      // TODO : compléter les assertions quand le format de réponse sera défini
    language: text/javascript
order: 3000
