$kind: http-request
name: ENTREE -> B204 (ascenseur)
description: 54.95 m, 92.3 s, 7 instructions, trajet par l'ascenseur.
url: "{{baseUrl}}/api/route?from=ENTREE&to=B204&accessible=false"
method: GET
headers:
  Accept: application/json
queryParams:
  from: ENTREE
  to: B204
  accessible: "false"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Réponse JSON", () => pm.response.to.be.json);

      const body = pm.response.json();
      pm.test("Champs de la réponse", () => pm.expect(body).to.have.all.keys("distanceMeters","durationSeconds","path","steps"));
      pm.test("Nœuds du chemin : id, floor, x, y, type, label", () => body.path.forEach(n => pm.expect(n).to.have.all.keys("id","floor","x","y","type","label")));
      pm.test("Instructions : text, sub, floor, icon", () => body.steps.forEach(s => pm.expect(s).to.have.all.keys("text","sub","floor","icon")));


      pm.test("Distance ≈ 54.95 m", () => pm.expect(body.distanceMeters).to.be.closeTo(54.95, 0.01));
      pm.test("Durée ≈ 92.3 s", () => pm.expect(body.durationSeconds).to.be.closeTo(92.3, 0.1));

      pm.test("Chemin attendu", () => pm.expect(body.path.map(n => n.id)).to.eql(["ENTREE","C0_2","C0_3","C0_4","E0","E1","E2","C2_4","C2_3","B204"]));
      pm.test("7 instructions", () => pm.expect(body.steps).to.have.lengthOf(7));
      pm.test("Instruction ascenseur", () => pm.expect(body.steps[3].text).to.eql("Prenez l'ascenseur et montez au 2e étage"));
      pm.test("Dernière instruction", () => pm.expect(body.steps[6].text).to.eql("Vous êtes arrivé : B204"));
    language: text/javascript
order: 1000
