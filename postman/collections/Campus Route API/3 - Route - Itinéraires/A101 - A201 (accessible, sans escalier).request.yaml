$kind: http-request
name: "A101 -> A201 (accessible, sans escalier)"
description: "L'option accessible force l'ascenseur, à l'angle du L : trajet plus long."
url: "{{baseUrl}}/api/route?from=A101&to=A201&accessible=true"
method: GET
headers:
  Accept: application/json
queryParams:
  from: "A101"
  to: "A201"
  accessible: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();

      pm.test("Distance ≈ 119.7 m", () => pm.expect(body.distanceMeters).to.be.closeTo(119.7, 0.01));
      pm.test("Durée ≈ 117.1 s", () => pm.expect(body.durationSeconds).to.be.closeTo(117.1, 0.1));

      pm.test("Aucun nœud d'escalier", () => pm.expect(body.path.some(n => n.type === "STAIRS")).to.be.false);
      pm.test("Passe par l'ascenseur", () => pm.expect(body.path.some(n => n.type === "ELEVATOR")).to.be.true);
    language: text/javascript
order: 5000
