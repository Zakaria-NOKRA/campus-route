$kind: http-request
name: "C0-D1 -> C209 (escalier est)"
description: "Depuis la porte du bâtiment C vers l'aile est au 2e étage : escalier S2, juste à côté."
url: "{{baseUrl}}/api/route?from=C0-D1&to=C209"
method: GET
headers:
  Accept: application/json
queryParams:
  from: "C0-D1"
  to: "C209"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();

      pm.test("Distance ≈ 87.36 m", () => pm.expect(body.distanceMeters).to.be.closeTo(87.36, 0.01));
      pm.test("Durée ≈ 91.2 s", () => pm.expect(body.durationSeconds).to.be.closeTo(91.2, 0.1));
      pm.test("Escalier est S2", () => pm.expect(body.path.map(n => n.id)).to.include.members(["C0-S2","C1-S2","C2-S2"]));
    language: text/javascript
order: 6000
