$kind: http-request
name: B108 -> B207
description: Deux étages, par le couloir et l'ascenseur.
url: "{{baseUrl}}/api/route?from=B108&to=B207"
method: GET
headers:
  Accept: application/json
queryParams:
  from: B108
  to: B207
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();

      pm.test("Distance ≈ 63.42 m", () => pm.expect(body.distanceMeters).to.be.closeTo(63.42, 0.01));
      pm.test("Durée ≈ 73.8 s", () => pm.expect(body.durationSeconds).to.be.closeTo(73.8, 0.1));
    language: text/javascript
order: 6000
