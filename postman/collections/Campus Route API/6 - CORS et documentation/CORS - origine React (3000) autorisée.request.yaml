$kind: http-request
name: "CORS : origine React (3000) autorisée"
description: Le front Create React App peut appeler l'API.
url: "{{baseUrl}}/api/plan"
method: GET
headers:
  Accept: application/json
  Origin: http://localhost:3000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Access-Control-Allow-Origin = http://localhost:3000", () => pm.expect(pm.response.headers.get("Access-Control-Allow-Origin")).to.eql("http://localhost:3000"));
    language: text/javascript
order: 2000
