$kind: http-request
description: "Le paramètre est optionnel : liste vide, pas d'erreur."
url: "{{baseUrl}}/api/rooms/search"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Liste vide", () => pm.expect(pm.response.json()).to.eql([]));
    language: text/javascript
order: 8000
