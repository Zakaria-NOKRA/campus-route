$kind: http-request
description: "Deux laboratoires : B104 et B203, triés par code."
url: "{{baseUrl}}/api/rooms/search?q=labo"
method: GET
headers:
  Accept: application/json
queryParams:
  q: labo
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const codes = pm.response.json().map(r => r.code);
      pm.test("B104 et B203, dans cet ordre", () => pm.expect(codes).to.eql(["B104","B203"]));
    language: text/javascript
order: 4000
