$kind: http-request
description: "Les espaces sont ignorés : même résultat que a204."
url: "{{baseUrl}}/api/rooms/search?q=a 204"
method: GET
headers:
  Accept: application/json
queryParams:
  q: "a 204"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const rooms = pm.response.json();
      pm.test("Un seul résultat : A204", () => { pm.expect(rooms).to.have.lengthOf(1); pm.expect(rooms[0].code).to.eql("A204"); });
    language: text/javascript
order: 2000
