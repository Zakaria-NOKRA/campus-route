$kind: http-request
name: "Bâtiment inconnu (Z) -> 404"
description: "Erreur JSON lisible."
url: "{{baseUrl}}/api/plan?building=Z"
method: GET
headers:
  Accept: application/json
queryParams:
  building: "Z"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const e = pm.response.json();
      pm.test("status = 404 dans le corps", () => pm.expect(e.status).to.eql(404));
      pm.test("Message : Bâtiment Z introuvable", () => pm.expect(e.message).to.eql("Bâtiment Z introuvable"));
    language: text/javascript
order: 6000
