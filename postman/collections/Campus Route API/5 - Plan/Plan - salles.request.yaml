$kind: http-request
name: "Plan : salles"
description: "Champs, tri par code, rectangle et porte de A204."
url: "{{baseUrl}}/api/plan?building=A"
method: GET
headers:
  Accept: application/json
queryParams:
  building: "A"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const rooms = pm.response.json().rooms;
      pm.test("Champs d'une salle", () => rooms.forEach(r => pm.expect(r).to.have.all.keys("code","name","type","tag","floor","building","x","y","width","height","doorX","doorY")));
      pm.test("Pas de nœud imbriqué", () => rooms.forEach(r => pm.expect(r).to.not.have.property("node")));
      pm.test("Toutes dans le bâtiment A", () => rooms.forEach(r => pm.expect(r.building).to.eql("A")));
      pm.test("Triées par code", () => { const c = rooms.map(r => r.code); pm.expect(c).to.eql([...c].sort()); });
      pm.test("12, 10 et 10 salles par étage", () => pm.expect([0, 1, 2].map(f => rooms.filter(r => r.floor === f).length)).to.eql([12, 10, 10]));
      pm.test("A204 : rectangle 750,20 230x100, porte 865,120", () => {
      const r = rooms.find(r => r.code === "A204");
      pm.expect(r).to.include({ floor: 2, x: 750, y: 20, width: 230, height: 100, doorX: 865, doorY: 120 });
      });
    language: text/javascript
order: 2000
