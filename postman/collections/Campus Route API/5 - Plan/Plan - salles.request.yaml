$kind: http-request
name: "Plan : salles"
description: Champs, tri par code, position de B204.
url: "{{baseUrl}}/api/plan"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const rooms = pm.response.json().rooms;
      pm.test("Champs d'une salle", () => rooms.forEach(r => pm.expect(r).to.have.all.keys("code","name","type","tag","floor","slot","top","x","y")));
      pm.test("Pas de nœud imbriqué", () => rooms.forEach(r => pm.expect(r).to.not.have.property("node")));
      pm.test("Triées par code", () => { const c = rooms.map(r => r.code); pm.expect(c).to.eql([...c].sort()); });
      pm.test("9 salles par étage", () => [0, 1, 2].forEach(f => pm.expect(rooms.filter(r => r.floor === f)).to.have.lengthOf(9)));
      pm.test("B204 : étage 2, position 3 en haut, x=536 y=115", () => {
      const r = rooms.find(r => r.code === "B204");
      pm.expect(r).to.include({ floor: 2, slot: 3, top: true, x: 536, y: 115 });
      });
    language: text/javascript
order: 2000
