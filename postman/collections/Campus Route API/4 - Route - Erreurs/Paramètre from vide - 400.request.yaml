$kind: http-request
name: "Paramètre from vide -> 400"
description: "from= (valeur vide)."
url: "{{baseUrl}}/api/route?from=&to=A204"
method: GET
headers:
  Accept: application/json
queryParams:
  from: ""
  to: "A204"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const e = pm.response.json();
      pm.test("status = 400 dans le corps", () => pm.expect(e.status).to.eql(400));
      pm.test("Message : Paramètre obligatoire vide : from", () => pm.expect(e.message).to.eql("Paramètre obligatoire vide : from"));
    language: text/javascript
order: 5000
