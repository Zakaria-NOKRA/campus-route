$kind: http-request
name: Arrivée inconnue (ZZZ) -> 404
description: Message mentionnant ZZZ.
url: "{{baseUrl}}/api/route?from=B204&to=ZZZ"
method: GET
headers:
  Accept: application/json
queryParams:
  from: B204
  to: ZZZ
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const e = pm.response.json();
      pm.test("status = 404 dans le corps", () => pm.expect(e.status).to.eql(404));
      pm.test("Un message est fourni", () => pm.expect(e.message).to.be.a("string").that.is.not.empty);

      pm.test("Le message mentionne ZZZ", () => pm.expect(e.message).to.include("ZZZ"));
    language: text/javascript
order: 2000
