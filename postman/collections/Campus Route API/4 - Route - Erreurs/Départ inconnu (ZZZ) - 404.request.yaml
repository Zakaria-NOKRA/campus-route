$kind: http-request
name: "Départ inconnu (ZZZ) -> 404"
description: "Message mentionnant ZZZ."
url: "{{baseUrl}}/api/route?from=ZZZ&to=A204"
method: GET
headers:
  Accept: application/json
queryParams:
  from: "ZZZ"
  to: "A204"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 404", () => pm.response.to.have.status(404));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const e = pm.response.json();
      pm.test("status = 404 dans le corps", () => pm.expect(e.status).to.eql(404));
      pm.test("Message : Point ZZZ introuvable", () => pm.expect(e.message).to.eql("Point ZZZ introuvable"));
    language: text/javascript
order: 1000
