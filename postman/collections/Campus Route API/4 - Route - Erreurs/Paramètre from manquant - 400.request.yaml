$kind: http-request
name: "Paramètre from manquant -> 400"
description: "Seul to est fourni."
url: "{{baseUrl}}/api/route?to=A204"
method: GET
headers:
  Accept: application/json
queryParams:
  to: "A204"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      pm.test("Réponse JSON", () => pm.response.to.be.json);
      const e = pm.response.json();
      pm.test("status = 400 dans le corps", () => pm.expect(e.status).to.eql(400));
      pm.test("Message : Paramètre obligatoire manquant : from", () => pm.expect(e.message).to.eql("Paramètre obligatoire manquant : from"));
    language: text/javascript
order: 4000
